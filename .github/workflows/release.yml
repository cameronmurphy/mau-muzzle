name: release

# Only a version tag builds. Every run publishes a release, so there is no
# unsigned fallback: it's signed and notarized, or it fails.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history: the bundle version is derived from them.
          fetch-depth: 0

      # An unnotarized release is refused by Gatekeeper on every machine that
      # downloads it, so fail before building rather than ship something broken.
      - name: Require signing and notarization secrets
        env:
          CERT: ${{ secrets.CERT_P12_BASE64 }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          missing=0
          [ -n "$CERT" ] || { echo "::error::CERT_P12_BASE64 is empty or unset."; missing=1; }
          [ -n "$SIGN_IDENTITY" ] || { echo "::error::SIGN_IDENTITY is empty or unset."; missing=1; }
          [ -n "$NOTARY_KEY" ] || { echo "::error::AC_API_KEY_BASE64 is empty or unset, so the app cannot be notarized."; missing=1; }
          exit $missing

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Self test
        run: make selftest

      - name: Build and sign
        run: make app SIGN_ID="${{ secrets.SIGN_IDENTITY }}"

      - name: Verify signature
        run: |
          codesign --verify --strict --verbose=2 build/MAUMuzzle.app
          codesign -dvvv build/MAUMuzzle.app 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"

      - name: Notarize and staple
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          ditto -c -k --keepParent build/MAUMuzzle.app "$RUNNER_TEMP/MAUMuzzle.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MAUMuzzle.zip" \
            --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH"
          xcrun stapler staple build/MAUMuzzle.app
          xcrun stapler validate build/MAUMuzzle.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/MAUMuzzle.app build/MAUMuzzle.zip
          shasum -a 256 build/MAUMuzzle.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: build/MAUMuzzle.zip
